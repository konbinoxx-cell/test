name: Test FAQ Process

on:
  workflow_dispatch:

jobs:
  test-faq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '18'

      - name: Debug before script
        run: |
          echo "=== 脚本执行前 ==="
          ls -la scripts/process-answer.js
          echo "=== 当前faq-data.json内容 ==="
          cat faq-data.json || echo "文件为空或不存在"

      - name: Run test script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/process-answer.js

      - name: Debug after script  
        run: |
          echo "=== 脚本执行后 ==="
          ls -la faq-data.json
          echo "=== 文件内容 ==="
          cat faq-data.json || echo "文件为空"
          echo "=== 文件大小 ==="
          wc -c faq-data.json
