name: Test FAQ Process

on:
  workflow_dispatch:

jobs:
  test-faq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '18'

      - name: Install dependencies
        run: npm install @actions/core @actions/github

      - name: Run test script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/process-answer.js

      - name: Verify file changes
        run: |
          echo "=== 检查文件内容 ==="
          cat faq-data.json
          echo "=== 检查文件状态 ==="
          git status
          echo "=== 检查文件差异 ==="
          git diff faq-data.json || echo "无差异"
